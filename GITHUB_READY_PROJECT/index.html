<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>DRONACHARYA R&D LAB MANAGMENT</title>

    <!-- PWA Settings -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#071f3a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Dronacharya Lab" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased min-h-screen selection:bg-blue-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- PWA Universal Install Banner -->
    <div id="pwa-install-banner" style="display:none; position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; max-width: 94%; width: 430px; background: #071f3a; color: white; border: 1.5px solid #d4af37; border-radius: 16px; padding: 12px 16px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5); font-family: system-ui, -apple-system, sans-serif;">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
        <img src="/icon-192.png" alt="Logo" style="width: 42px; height: 42px; border-radius: 10px; border: 1px solid #d4af37; object-fit: cover; flex-shrink: 0;" />
        <div style="flex: 1; min-width: 0;">
          <div style="font-weight: 700; font-size: 13.5px; color: #f8fafc; line-height: 1.2;">DRONACHARYA R&D LAB</div>
          <div style="font-size: 11.5px; color: #94a3b8; margin-top: 2px;">Install as App on Mobile &amp; PC</div>
        </div>
        <div style="display: flex; align-items: center; gap: 8px;">
          <button id="pwa-install-btn" style="background: #2563eb; color: white; border: none; font-size: 12px; font-weight: 700; padding: 7px 14px; border-radius: 8px; cursor: pointer; transition: 0.2s;">
            Install App
          </button>
          <button id="pwa-close-btn" style="background: transparent; color: #94a3b8; border: none; font-size: 20px; line-height: 1; cursor: pointer; padding: 2px 4px;">&times;</button>
        </div>
      </div>
      <div id="ios-instructions" style="display:none; margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.1); font-size: 11px; color: #cbd5e1; text-align: center;">
        📱 iPhone/iPad me chalane ke liye: <strong>Share (⎋)</strong> dabayein aur <strong>'Add to Home Screen' (➕)</strong> select karein.
      </div>
    </div>

    <!-- Service Worker & PWA Logic -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(
            (reg) => console.log('PWA ServiceWorker registered with scope:', reg.scope),
            (err) => console.log('PWA ServiceWorker error:', err)
          );
        });
      }

      let deferredPrompt;
      const banner = document.getElementById('pwa-install-banner');
      const installBtn = document.getElementById('pwa-install-btn');
      const closeBtn = document.getElementById('pwa-close-btn');
      const iosInstructions = document.getElementById('ios-instructions');

      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
      const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;

      if (!isStandalone) {
        if (isIOS) {
          setTimeout(() => {
            if (banner) {
              banner.style.display = 'block';
              if (installBtn) installBtn.style.display = 'none';
              if (iosInstructions) iosInstructions.style.display = 'block';
            }
          }, 1500);
        } else {
          window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            if (banner) banner.style.display = 'block';
          });
        }
      }

      if (installBtn) {
        installBtn.addEventListener('click', async () => {
          if (!deferredPrompt) {
            alert('To install this app on your device:\n1. Click browser menu (three dots ⋮)\n2. Select "Install app" or "Add to Home screen"');
            return;
          }
          deferredPrompt.prompt();
          const { outcome } = await deferredPrompt.userChoice;
          deferredPrompt = null;
          if (banner) banner.style.display = 'none';
        });
      }

      if (closeBtn) {
        closeBtn.addEventListener('click', () => {
          if (banner) banner.style.display = 'none';
        });
      }

      window.addEventListener('appinstalled', () => {
        if (banner) banner.style.display = 'none';
        console.log('App was installed successfully!');
      });
    </script>
  </body>
</html>
